name: iOS app
on:
  push:
    branches: [main, feat/ios-swift-app, feature/truedepth-scanner-demo]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.ref_name != 'feature/truedepth-scanner-demo'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: github.ref_name != 'feature/truedepth-scanner-demo'
      - run: npm test
        if: github.ref_name != 'feature/truedepth-scanner-demo'
      - name: Prepare bundled studio for legacy branches
        if: github.ref_name != 'feature/truedepth-scanner-demo'
        run: npm run ios:prepare
      - name: Check scanner package
        if: github.ref_name == 'feature/truedepth-scanner-demo'
        working-directory: ios/GripItScannerCore
        run: swift test
      - name: Choose simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test Swift app
        run: xcodebuild test -project ios/GripIt.xcodeproj -scheme GripIt -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO
      - name: Build for physical iPhone without signing
        if: github.ref_name == 'feature/truedepth-scanner-demo'
        run: xcodebuild build -project ios/GripIt.xcodeproj -scheme GripIt -destination 'generic/platform=iOS' -derivedDataPath ios/device-build CODE_SIGNING_ALLOWED=NO
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-build-diagnostics
          path: ios/build/Logs/Test/*.xcresult
          retention-days: 3
