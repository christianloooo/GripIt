name: iOS app
on:
  push:
    branches: [main, feat/ios-swift-app, feature/truedepth-scanner-demo, feature/native-grip-viewer]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Detect native scanner project
        id: app
        run: |
          if [ -f ios/GripItScannerCore/Package.swift ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.native != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.app.outputs.native != 'true'
      - run: npm test
        if: steps.app.outputs.native != 'true'
      - name: Prepare bundled studio for legacy branches
        if: steps.app.outputs.native != 'true'
        run: npm run ios:prepare
      - name: Check scanner package
        if: steps.app.outputs.native == 'true'
        working-directory: ios/GripItScannerCore
        run: swift test
      - name: Check native dependency wiring
        if: steps.app.outputs.native == 'true'
        run: node --test scripts/test-ios-dependencies.mjs
      - name: Choose simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test Swift app
        shell: bash
        run: xcodebuild test -project ios/GripIt.xcodeproj -scheme GripIt -destination "platform=iOS Simulator,id=$DEVICE_ID,arch=arm64" -derivedDataPath ios/build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/scanner-xcodebuild.log
      - name: Build for physical iPhone without signing
        shell: bash
        if: steps.app.outputs.native == 'true'
        run: xcodebuild build -project ios/GripIt.xcodeproj -scheme GripIt -destination 'generic/platform=iOS' -derivedDataPath ios/device-build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/scanner-device-build.log
      - name: Report compiler diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('ios').glob('scanner-*.log'):
              for line in path.read_text(errors='replace').splitlines():
                  if any(term in line for term in ('error:', 'Testing failed:', 'failed to', 'failed with')):
                      message = line.strip().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error::{message[:3000]}')
          PY
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-build-diagnostics
          path: |
            ios/build/Logs/Test/*.xcresult
            ios/scanner-*.log
          retention-days: 3
