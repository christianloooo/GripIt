name: iOS app
on:
  push:
    branches: [main, feat/ios-swift-app]
  pull_request:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ios:prepare
      - name: Choose simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test Swift app
        run: xcodebuild test -project ios/GripIt.xcodeproj -scheme GripIt -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO
